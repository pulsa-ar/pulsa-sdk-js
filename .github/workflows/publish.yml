# Stages @pulsa/sdk on npm for each release tag. npm trusts this workflow directly (trusted
# publishing, configured on the package's npm settings page), so no npm token is stored
# anywhere, and each version carries provenance linking it to the commit it was built from.
#
# Staged, not published: the version is uploaded but not installable until a maintainer
# approves it with 2FA (on npmjs.com, or `npm stage approve`). CI cannot approve its own
# upload, so a compromised workflow cannot ship a release on its own.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Staged publishing through trusted publishing needs npm 11.15 or newer; Node 22 ships
      # an older one.
      - run: npm install --global "npm@^11.15.0"

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # A version on npm can never be replaced, so a re-run, or a version first published by
      # hand, ends here instead of failing.
      - name: Check the version is not on npm yet
        id: registry
        run: |
          package="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          if npm view "${package}" version > /dev/null 2>&1; then
            echo "::notice::${package} is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.registry.outputs.published != 'true'
        run: npm ci
      - if: steps.registry.outputs.published != 'true'
        run: npm run typecheck && npm test && npm run build
      - if: steps.registry.outputs.published != 'true'
        run: npm stage publish
      - if: steps.registry.outputs.published != 'true'
        run: echo "::notice::Staged. Approve it on npmjs.com with 2FA to make it installable."
