<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pulsa demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; padding: 16px; max-width: 760px; }
      h1 { font-family: Outfit, system-ui, sans-serif; font-weight: 600; }
      form { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; margin-bottom: 16px; }
      input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 12px 0; }
      #log { font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 260px; overflow: auto;
             padding: 8px; border-radius: 8px; background: color-mix(in srgb, currentColor 6%, transparent); }
      pulsa-recognizer { max-width: 100%; }
    </style>
  </head>
  <body>
    <h1>pulsa demo</h1>
    <p>
      Paste the test key pulsa gave you and start signing. The video stays in your browser: only
      body and hand landmarks are sent to pulsa. Every element here is the
      <a href="https://github.com/pulsa-ar/pulsa-sdk-js">pulsa SDK</a> you embed on your own site.
    </p>
    <form id="settings">
      <label for="key">API key</label><input id="key" type="text" autocomplete="off" />
      <label for="endpoint">Endpoint</label><input id="endpoint" type="text" />
      <label for="vocabulary">Vocabulary</label><input id="vocabulary" type="text" placeholder="all the key allows, or e.g. YO,DOLOR" />
      <span></span><button type="submit">Start</button>
    </form>

    <pulsa-recognizer show-glosses></pulsa-recognizer>

    <div class="controls">
      <button id="reset" type="button">Reset sentence</button>
      <label><input id="left-handed" type="checkbox" /> Left-handed signer</label>
      <label><input id="show-glosses" type="checkbox" checked /> Show glosses</label>
      <label><input id="mirrored" type="checkbox" checked /> Mirrored</label>
      <label>Locale <select id="locale"><option>es</option><option>en</option></select></label>
    </div>
    <div id="log" aria-live="polite"></div>

    <script type="module">
      import { DEFAULT_ENDPOINT } from "../src/index.ts";

      const recognizer = document.querySelector("pulsa-recognizer");
      const log = document.getElementById("log");
      const field = (id) => document.getElementById(id);
      // Nothing is read from the address: a shared link must not carry a key, nor point
      // a key someone pastes at another server. `npm run dev` talks to a local server.
      const defaultEndpoint = import.meta.env.DEV ? "ws://localhost:8000/v1/stream" : DEFAULT_ENDPOINT;
      field("endpoint").value = defaultEndpoint;

      const write = (line) => {
        log.textContent = `${new Date().toLocaleTimeString()}  ${line}\n` + log.textContent;
      };
      recognizer.onStatus = (status) => write(`status: ${status}`);
      recognizer.onReady = (signs) => write(`ready: ${signs.length} signs`);
      recognizer.onSentence = ({ text, pending }) => write(`sentence: ${text.join(" ")}  [pending: ${pending.join(" ")}]`);
      recognizer.onSentenceFinished = ({ glosses, text }) => write(`FINISHED: ${text.join(" ")}  (${glosses.join(" ")})`);
      recognizer.onError = (error) => write(`error${error.fatal ? " (fatal)" : ""}: ${error.code} - ${error.message}`);

      const setOrRemove = (name, value) =>
        value ? recognizer.setAttribute(name, value) : recognizer.removeAttribute(name);
      const start = () => {
        setOrRemove("endpoint", field("endpoint").value.trim());
        setOrRemove("vocabulary", field("vocabulary").value.trim());
        setOrRemove("api-key", field("key").value.trim());
      };
      field("settings").addEventListener("submit", (event) => {
        event.preventDefault();
        start();
      });
      field("reset").addEventListener("click", () => recognizer.reset());
      field("left-handed").addEventListener("change", (event) => {
        recognizer.toggleAttribute("left-handed", event.target.checked);
        write(event.target.checked ? "left-handed: frames are mirrored" : "right-handed");
      });
      field("show-glosses").addEventListener("change", (event) => recognizer.toggleAttribute("show-glosses", event.target.checked));
      field("mirrored").addEventListener("change", (event) => recognizer.setAttribute("mirrored", String(event.target.checked)));
      field("locale").addEventListener("change", (event) => recognizer.setAttribute("locale", event.target.value));
    </script>
  </body>
</html>
